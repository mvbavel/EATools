<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EATools — Architecture Diagram to LeanIX</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>EATools</h1>
    <p class="sub">Read IT architecture diagrams &rarr; review the inventory &rarr; export LeanIX CSVs.</p>
  </header>

  <main>
    <section id="upload-panel">
      <div id="dropzone" tabindex="0" role="button" aria-label="Choose diagram files">
        <strong>Drop diagrams here</strong>
        <span>or click to browse</span>
        <small>.drawio &middot; .vsdx &middot; .pptx &middot; .pdf &middot; .png / .jpg</small>
      </div>
      <input type="file" id="file-input" multiple hidden
             accept=".drawio,.xml,.vsdx,.pptx,.pdf,.png,.jpg,.jpeg,.gif,.webp,.bmp,.tif,.tiff">

      <ul id="file-list"></ul>

      <label for="context">Context <span class="hint">optional — org names, scope, conventions the diagram assumes</span></label>
      <textarea id="context" rows="3"
        placeholder="e.g. This is the claims platform for the UK entity. Boxes with dashed borders are planned, not live."></textarea>

      <button id="analyse" disabled>Analyse diagrams</button>
      <p id="status" role="status"></p>
    </section>

    <section id="results" hidden>
      <div id="summary"></div>

      <nav id="tabs" role="tablist"></nav>
      <div id="table-wrap"></div>

      <div id="questions"></div>

      <div class="actions">
        <button id="export-zip">Download all CSVs (.zip)</button>
        <button id="export-sheet" class="secondary">Download this sheet</button>
        <button id="restart" class="secondary">Start over</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
